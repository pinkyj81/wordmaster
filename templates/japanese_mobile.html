{% extends "base.html" %}
{% block content %}
<style>
  body { background: #f5f5f5; }
  .mobile-wrap { max-width: 480px; margin: 0 auto; padding: 12px 0 40px; }
  .page-header {
    font-size: 18px; font-weight: 700; color: #1e1b4b;
    padding: 8px 4px 14px; margin-bottom: 4px;
  }
  .day-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    text-decoration: none;
    color: inherit;
  }
  .day-card:active { background: #f0f0f0; }
  .day-label { font-weight: 700; font-size: 16px; color: #222; }
  .day-count { font-size: 12px; color: #999; margin-top: 2px; }
  .badge-done {
    font-size: 12px; color: #22c55e; font-weight: 600;
    background: #dcfce7; border-radius: 20px; padding: 3px 10px;
  }
  .arrow-icon { color: #aaa; font-size: 18px; margin-left: 10px; }
</style>

<div class="mobile-wrap">
  <div class="page-header">일본어 학습</div>

  {% if chapters %}
    {% for ch in chapters %}
    <a href="{{ url_for('japanese_mobile_chapter', study_title=ch.study_title) }}"
       class="day-card">
      <div>
        <div class="day-label">{{ ch.study_title }}</div>
        <div class="day-count">{{ ch.sentence_count }}문장</div>
      </div>
      <div class="flex items-center gap-2">
        <span class="badge-done">완료</span>
        <span class="arrow-icon">→</span>
      </div>
    </a>
    {% endfor %}
  {% else %}
    <div class="text-center text-gray-400 mt-20 text-sm">등록된 학습 데이터가 없습니다.</div>
  {% endif %}
</div>
{% endblock %}
