{% extends "base.html" %}
{% block content %}

<h2 class="text-2xl font-semibold mb-6 text-gray-800 text-center">암기카드</h2>

<!-- ✅ 암기카드 팝업 -->
<div id="flashcardModal"
     class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 backdrop-blur-sm">
  
  <!-- 카드 -->
  <div id="flashcard"
       class="text-white rounded-3xl shadow-2xl w-[90%] max-w-3xl h-[60vh]
              flex flex-col justify-center items-center transition-all duration-500 cursor-pointer select-none relative bg-gradient-to-br from-indigo-500 to-purple-500"
       onclick="flipCard()">

    <!-- 진행도 -->
    <div class="absolute top-4 right-6 text-sm opacity-80">
      <span id="progressCount">1 / 1</span>
    </div>

    <!-- 앞면 -->
    <div id="front" class="text-center transition-all duration-300 ease-in-out">
      <p id="word" class="text-5xl font-bold tracking-tight"></p>
      <p class="mt-8 text-sm opacity-70">(클릭하여 뜻 보기)</p>
    </div>

    <!-- ✅ 뒷면 -->
    <div id="back"
         class="hidden text-center transition-all duration-300 ease-in-out 
                bg-gradient-to-br from-[#5C6BF6] to-[#7D84FF]
                w-full h-full rounded-3xl flex flex-col justify-center items-center">
      <p id="wordBack" class="text-5xl font-bold tracking-tight mb-4 text-white"></p>
      <p id="meaning" class="text-2xl font-medium text-white/90 text-center max-w-xl px-6 leading-snug line-clamp-2"></p>
      <p id="sentence" class="mt-3 text-2xl font-medium text-white/90 text-center max-w-2xl px-8 leading-relaxed"></p>

      <!-- ✅ 단어/문장 듣기 버튼 -->
      <div class="mt-6 flex items-center gap-3">
        <button
          onclick="playSound(event, document.getElementById('wordBack').innerText, 'word')"
          id="wordSoundBtn"
          class="bg-white text-indigo-600 px-4 py-2 rounded-full shadow hover:bg-indigo-100 flex items-center space-x-2">
          <span>🔊</span>
          <span>단어 듣기</span>
        </button>
        <button
          onclick="playSound(event, getSentenceForSpeech(), 'sentence')"
          id="sentenceSoundBtn"
          class="bg-white text-indigo-600 px-4 py-2 rounded-full shadow hover:bg-indigo-100 flex items-center space-x-2">
          <span>🗣️</span>
          <span>문장 듣기</span>
        </button>
      </div>
      <audio id="audio"></audio>

      <p class="mt-8 text-sm opacity-80">(클릭하여 다음 단어로)</p>
    </div>
  </div>

  <!-- 하단 버튼 -->
  <div class="absolute bottom-10 w-full flex justify-center space-x-4">
    <button onclick="prevCard()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300">◀ 이전</button>
    <button onclick="nextCard()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300">다음 ▶</button>
    <button onclick="closeFlashcardModal()" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">닫기</button>
  </div>
</div>

<script>
function playSound(event, text, mode) {
  // 카드 클릭 이벤트가 부모로 전달되지 않게 막기
  event.stopPropagation();

  const cleanText = String(text || '').trim();
  if (!cleanText) {
    alert(mode === 'sentence' ? '문장이 없습니다.' : '단어가 없습니다.');
    return;
  }

  const audio = document.getElementById('audio');
  const language = (cards[currentIndex]?.language || 'english');
  const url = `/tts_text?text=${encodeURIComponent(cleanText)}&lang=${encodeURIComponent(language)}&mode=${encodeURIComponent(mode || 'word')}&t=${Date.now()}`;
  audio.src = url; // 캐시 방지
  audio.play();
}

function getCurrentSentence() {
  const sentence = (cards[currentIndex]?.sentence || '').trim();
  return sentence;
}

function removeKoreanForSpeech(text) {
  return String(text || '')
    // 한글이 포함된 대괄호/소괄호 구간은 통째로 제거
    .replace(/\s*[\[\(（][^\]\)）]*[\uac00-\ud7a3][^\]\)）]*[\]\)）]\s*/g, ' ')
    // 남아 있는 한글은 제거
    .replace(/[\uac00-\ud7a3]+/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function getSentenceForSpeech() {
  const sentence = getCurrentSentence();
  if (!sentence) return '';

  const currentWord = String(cards[currentIndex]?.word || '').trim();
  if (!currentWord) return sentence;

  const replaced = sentence.replace(/_{3,}/g, currentWord);
  return removeKoreanForSpeech(replaced);
}

let currentIndex = 0;
let isFront = true;
const cards = {{ words | tojson }};

function openFlashcardModal() {
  document.getElementById("flashcardModal").classList.remove("hidden");
  currentIndex = 0;
  isFront = true;
  showCard();
}

function closeFlashcardModal() {
  // 모달 닫기 (페이지 전체 리로드 대신 숨기기 및 오디오 정리)
  const modal = document.getElementById("flashcardModal");
  if (modal) modal.classList.add("hidden");
  const audio = document.getElementById('audio');
  if (audio) { audio.pause(); audio.currentTime = 0; }
  // Navigate back to text list immediately
  window.location.href = '/';
}

function flipCard() {
  const front = document.getElementById("front");
  const back = document.getElementById("back");
  const flashcard = document.getElementById("flashcard");

  if (isFront) {
    // 앞면 → 뒷면
    front.classList.add("hidden");
    back.classList.remove("hidden");
    flashcard.classList.remove("from-indigo-500", "to-purple-500");
    flashcard.classList.add("from-[#5C6BF6]", "to-[#7D84FF]");
    isFront = false;
  } else {
    // 뒷면 → 다음 카드로
    nextCard();
  }
}

function showCard() {
  const card = cards[currentIndex];
  document.getElementById("word").innerText = card.word;
  document.getElementById("wordBack").innerText = card.word;
  document.getElementById("meaning").innerText = card.meaning;
  const sentenceText = (card.sentence || '').trim();
  document.getElementById("sentence").innerText = sentenceText ? `[${sentenceText}]` : '';
  const sentenceBtn = document.getElementById('sentenceSoundBtn');
  if (sentenceBtn) {
    sentenceBtn.disabled = !sentenceText;
    sentenceBtn.classList.toggle('opacity-40', !sentenceText);
    sentenceBtn.classList.toggle('cursor-not-allowed', !sentenceText);
  }
  document.getElementById("progressCount").innerText = `${currentIndex + 1} / ${cards.length}`;

  // 초기화 (앞면으로)
  const front = document.getElementById("front");
  const back = document.getElementById("back");
  const flashcard = document.getElementById("flashcard");
  front.classList.remove("hidden");
  back.classList.add("hidden");
  flashcard.classList.remove("from-[#5C6BF6]", "to-[#7D84FF]");
  flashcard.classList.add("from-indigo-500", "to-purple-500");
  isFront = true;
}

function nextCard() {
  if (currentIndex < cards.length - 1) {
    currentIndex++;
    showCard();
  } else {
    alert("모든 카드를 다 봤습니다!");
    closeFlashcardModal();
  }
}

function prevCard() {
  if (currentIndex > 0) {
    currentIndex--;
  }
  showCard();
}

window.addEventListener('load', openFlashcardModal);
</script>

{% endblock %}
